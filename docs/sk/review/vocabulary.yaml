  - id: voc-015
    approved:
      ClearSpeak: "a hviezda, b"
      SimpleSpeak: "a hviezda, b"
    note: Asterisk.
    mathml: <math><mi>a</mi><mo>*</mo><mi>b</mi></math>
  - id: voc-016
    approved:
      ClearSpeak: "a deleno b"
      SimpleSpeak: "a deleno b"
    note: Division sign.
    mathml: <math><mi>a</mi><mo>÷</mo><mi>b</mi></math>
  - id: voc-017
    approved:
      ClearSpeak: "a deleno b"
      SimpleSpeak: "a deleno b"
    note: Slash between letters.
    mathml: <math><mi>a</mi><mo>/</mo><mi>b</mi></math>
  - id: voc-018
    approved:
      ClearSpeak: "a dvojbodka b"
      SimpleSpeak: "a dvojbodka b"
    note: Colon between letters.
    mathml: <math><mi>a</mi><mo>:</mo><mi>b</mi></math>
  - id: voc-019
    approved:
      ClearSpeak: "druhá odmocnina z"
      SimpleSpeak: "druhá odmocnina z"
    note: Square root sign on its own (the full root comes in the roots package). The English "the" is dropped.
    mathml: <math><mo>√</mo></math>
  - id: voc-020
    approved:
      ClearSpeak: "n faktoriál"
      SimpleSpeak: "n faktoriál"
    note: Factorial.
    mathml: <math><mi>n</mi><mo>!</mo></math>

  # Relations
  - id: voc-021
    approved:
      ClearSpeak: "a sa rovná b"
      SimpleSpeak: "a sa rovná b"
    note: Equals. "sa rovná" in both verbosities.
    mathml: <math><mi>a</mi><mo>=</mo><mi>b</mi></math>
  - id: voc-022
    approved:
      ClearSpeak: "a sa nerovná b"
      SimpleSpeak: "a sa nerovná b"
    note: Not equal.
    mathml: <math><mi>a</mi><mo>≠</mo><mi>b</mi></math>
  - id: voc-023
    approved:
      ClearSpeak: "a je menšie ako b"
      SimpleSpeak: "a menšie ako b"
    note: Less than. SABP uses the masculine "menší ako"; the alternative is the neuter "menšie ako". The same choice applies to voc-024 to voc-026.
    mathml: <math><mi>a</mi><mo>&lt;</mo><mi>b</mi></math>
  - id: voc-024
    approved:
      ClearSpeak: "a je väčšie ako b"
      SimpleSpeak: "a väčšie ako b"
    note: Greater than.
    mathml: <math><mi>a</mi><mo>&gt;</mo><mi>b</mi></math>
  - id: voc-025
    approved:
      ClearSpeak: "a je menšie alebo sa rovná b"
      SimpleSpeak: "a menšie alebo sa rovná b"
    note: Less than or equal.
    mathml: <math><mi>a</mi><mo>≤</mo><mi>b</mi></math>
  - id: voc-026
    approved:
      ClearSpeak: "a je väčšie alebo sa rovná b"
      SimpleSpeak: "a väčšie alebo sa rovná b"
    note: Greater than or equal.
    mathml: <math><mi>a</mi><mo>≥</mo><mi>b</mi></math>
  - id: voc-027
    approved:
      ClearSpeak: "a je totožné s b"
      SimpleSpeak: "a totožné s b"
    note: Identical to. "totožné" and "úmerné" (voc-028) are neuter, while voc-023 to voc-026 are masculine; one gender should be chosen for all relations.
    mathml: <math><mi>a</mi><mo>≡</mo><mi>b</mi></math>
  - id: voc-028
    approved:
      ClearSpeak: "a je úmerné s b"
      SimpleSpeak: "a úmerné s b"
    note: Proportional to.
    mathml: <math><mi>a</mi><mo>∝</mo><mi>b</mi></math>
  - id: voc-029
    approved:
      ClearSpeak: "p je rovnobežné s q"
      SimpleSpeak: "p rovnobežné s q"
    note: Parallel. "rovnobežná s" is feminine (priamka).
    mathml: <math><mi>p</mi><mo>∥</mo><mi>q</mi></math>
  - id: voc-030
    approved:
      ClearSpeak: "p nie je rovnobežné s q"
      SimpleSpeak: "p nerovnobežné s q"
    note: Not parallel.
    mathml: <math><mi>p</mi><mo>∦</mo><mi>q</mi></math>
  - id: voc-031
    approved:
      ClearSpeak: "3 delí 6"
      SimpleSpeak: "3 delí 6"
    note: Vertical bar as "divides". SABP has "delí".
    mathml: <math><mn>3</mn><mo>|</mo><mn>6</mn></math>

