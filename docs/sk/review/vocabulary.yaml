    mathml: <math><mn>30</mn><mo>°</mo><mspace width="1em"/><mn>5</mn><mo>%</mo></math>
  - id: voc-048
    approved:
      ClearSpeak: "20 stupňov Celzia"
      SimpleSpeak: "20 stupňov Celzia"
    note: Degree Celsius.
