# Review items for the topic "fractions". Format: see src/bin/review_package.rs.
# Build the package: cargo run --bin review-package -- docs/sk/review/fractions.yaml
topic: Fractions
known_issues:
  - Nothing is translated yet; this is a trial of the package format.
items:
  - id: frac-001
    note: Common fraction one half.
    mathml: <math><mfrac><mn>1</mn><mn>2</mn></mfrac></math>
  - id: frac-002
    note: Common fraction two thirds.
    mathml: <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math>
  - id: frac-003
    note: Seventeen tenths, read as an ordinal fraction.
    styles: [ClearSpeak]
    prefs:
      ClearSpeak_Fractions: Ordinal
    mathml: <math><mfrac><mn>17</mn><mn>10</mn></mfrac></math>
  - id: frac-004
    note: Fraction with letters.
    mathml: <math><mfrac><mi>a</mi><mi>b</mi></mfrac></math>
  - id: frac-005
    note: Fraction with a sum in the numerator.
    mathml: <math><mfrac><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math>
