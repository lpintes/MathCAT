---
 # Note to translators:
 #   most languages don't have two ways to pronounce 'a' -- if not need, remove the rules and change "B-Z" to "A-Z"
 #   some languages say the word for "uppercase" after the letter. Make sure to change that where appropriate by moving some code around
 - "a":
    - test:
        if: "$TTS='none'"
        then: [t: "a"]                         # long "a" sound in all speech engines I tested (espeak, MS SAPI, eloquence,
        else: [spell: "'a'"]                         #    AWS Polly, ReadSpeaker, NaturalReader, google cloud, nuance, ibm watson)
 - "b-z":
    - test:
        if: "$TTS='none'"
        then: [t: "."]
        else: [spell: "'.'"]

 # Capital letters are a little tricky: users can pick their favorite word (something that was requested) and
 # screen readers have options to use pitch changes or beeps instead of or in addition to say "cap"
 # Also, if a user can see the screen, they probably don't need to hear "cap", but if they specified an override, they must want to hear the override.

 - "A":
    - test:
        if: "$CapitalLetters_Beep"
        then:
        - audio:
            value: "beep.mp4"
            replace: []
    - test:
        if: "$CapitalLetters_UseWord"
        then_test:
          if: "$SpeechOverrides_CapitalLetters = ''"
          then_test:
            if: "$Impairment = 'Blindness'"
            then: [t: "veľké"]                # NVDA sk: "Veľké %s"
          else: [x: "$SpeechOverrides_CapitalLetters"]
    - pitch:
        value: "$CapitalLetters_Pitch"
        replace:
        - test:
            if: "$TTS='none'"
            then: [t: "a"]
            else: [spell: "'a'"]

 - "B-Z":
    - test:
        if: "$CapitalLetters_Beep"
        then:
        - audio:
            value: "beep.mp4"
            replace: []
    - test:
        if: "$CapitalLetters_UseWord"
        then_test:
          if: "$SpeechOverrides_CapitalLetters = ''"
          then_test:
            if: "$Impairment = 'Blindness'"
            then: [t: "veľké"]
          else: [x: "$SpeechOverrides_CapitalLetters"]
    - pitch:
        value: "$CapitalLetters_Pitch"
        # note: processing of ranges converts '.' into the character, so it needs to be in quotes below
        replace: [spell: "translate('.', 'BCDEFGHIJKLMNOPQRSTUVWXYZ', 'bcdefghijklmnopqrstuvwxyz')"]

 - "0-9": [t: "."]

 - " ": [t: " "]                     # 0x20

 - "!":                                            # 0x21
    - test:
        if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
        then_test:
            if: "$Verbosity = 'Terse'"
            then: [t: "výkričník"]                 # 0x21
            else: [t: "výkričník"]                 # 0x21
        else: [t: "faktoriál"]                     # 0x21

 - "\"": [t: "úvodzovky"]                          # 0x22
 - "#": [t: "mriežka"]                             # 0x23
 - "$": [t: "dolár"]                               # 0x24
 - "%": [t: "percento"]                            # 0x25
 - "&": [t: "ampersand"]                           # 0x26
 - "'": [t: "apostrof"]                            # 0x27
 - "(":                                            # 0x28
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then_test:
            if: "$Verbosity='Terse'"
            then: [t: "zátvorka"]                 # 0x28
            else: [t: "otvorená zátvorka"]        # 0x28
        else: [t: "ľavá zátvorka"]                # 0x28
 - ")":                                          # 0x29
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then_test:
            if: "$Verbosity='Terse'"
            then: [t: "koniec zátvorky"]         # 0x29
            else: [t: "zatvorená zátvorka"]      # 0x29
        else: [t: "pravá zátvorka"]              # 0x29

 - "*":                                          # 0x2a
    test:
        if: "parent::*[name(.)='msup' or name(.)='msubsup' or name(.)='skip-super']"
        then: [t: "hviezdička"]                  # 0x2a
        else: [t: "krát"]                        # 0x2a
 - "+": [t: "plus"]                              # 0x2b
 - ",":                                          # 0x2c
    # the following deals with the interaction of "," with "…" which sometimes wants the ',' to be silent
    # that this test is here and not with "…" is not ideal, but seems simplest
     test:
        if:
            - "$SpeechStyle != 'ClearSpeak' or $ClearSpeak_Ellipses = 'Auto' or "
               # must be ClearSpeak and $ClearSpeak_Ellipses = 'AndSoOn'
               # speak "comma" when not adjacent to '…'
            - "( following-sibling::*[1][text()!= '…'] and preceding-sibling::*[1][text()!='…']  ) or "
               # except if expression starts with '…'
            - "../*[1][.='…'] "
        then:
        - t: "čiarka"                         # 	(en: 'comma')
        - test:
            if: "$Verbosity != Terse"
            then: [pause: short]
        # else silent

 - "-": [t: "mínus"]                               # 0x2d
 - ".":                                          # 0x2e
    - test:
        if: "parent::*[1][self::m:mn]"
        then: [t: "bodka"]
        else: [t: "bodka"]
 - "/":                                           # 0x2f
    - test:
        - if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
          then: [t: "lomka"]                        # 0x2f
        - else_if: "parent::*[contains(@data-intent-property, ':unit:')] or preceding-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')] or following-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')]"
          then: [t: "za"]
          else: [t: "deleno"]                       # 0x2f

 - ":": [t: "dvojbodka"]                           # 0x3a
 - ";": [t: "bodkočiarka"]                         # 0x3b
 - "<":                                          # 0x3c
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "menší ako"
 - "=":                                           # 0x3d
    - test:
        if: "$Verbosity!='Terse'"
        then: [t: "sa rovná"]
        else: [t: "sa rovná"]

 - ">":                                          # 0x3e
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "väčší ako"
 - "?": [t: "otáznik"]                             # 0x3f
 - "@": [t: "zavináč"]                             # 0x40
 - "[":                                          # 0x5b
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then: [t: "otvorená hranatá zátvorka"]
        else: [t: "ľavá hranatá zátvorka"]
 - "\\": [t: "opačná lomka"]                       # 0x5c
 - "]":                                          # 0x5d
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then: [t: "zatvorená hranatá zátvorka"]
        else: [t: "pravá hranatá zátvorka"]
 - "^":                                           # 0x5e
    - test:
        if: "parent::m:modified-variable or parent::m:mover"
        then: [t: "strieška"]
        else: [t: "vokáň"]
 - "_": [t: "podčiarkovník"]                      # 0x5f
 - "`": [t: "prízvuk"]                            # 0x60
 - "{":                                         # 0x7b
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then: [t: "otvorená zložená zátvorka"]
        else: [t: "ľavá zložená zátvorka"]
 - "|":                                          # 0x7c
    # note: for ClearSpeak and SimpleSpeak, "|" inside of sets is handled at the mrow level, same for 'sets'
     - with:
        variables: [DefaultToGiven: "count(preceding-sibling::*)=1 and count(following-sibling::*)=1 and ../../../*[1][.='P']"] # P(A|B)
        replace:
        - test:
            - if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
              then: [t: "zvislá čiara"]
            - else_if: "$SpeechStyle != 'ClearSpeak'"
              then_test:
                - if: "$DefaultToGiven"
                  then: [t: "za podmienky"]
                - else_if: "preceding-sibling::*[1][self::m:mn and not(contains(., $DecimalSeparators))] and
                            following-sibling::*[1][self::m:mn and not(contains(., $DecimalSeparators))]"
                  then: [t: "delí"]
                  else: [t: "zvislá čiara"]
            - else_if: "not(preceding-sibling::*) or not(following-sibling::*)"
              then: [t: "zvislá čiara"]
            - else_if: "$ClearSpeak_VerticalLine = 'SuchThat'"
              then: [t: "také, že"]
            - else_if: "$ClearSpeak_VerticalLine = 'Given' or $DefaultToGiven"
              then: [t: "za podmienky"]
            - else: [t: "delí"]

 - "}":                                          # 0x7d
    - test:
        if: $SpeechStyle = 'ClearSpeak' or $SpeechStyle = 'SimpleSpeak'
        then: [t: "zatvorená zložená zátvorka"]
        else: [t: "pravá zložená zátvorka"]

 - "~": [t: "vlnovka"]                             # 0x7e
 - " ":                                            # 0xa0
    - test:
        # could be mtext in mtd or mtext in an mrow that is a concatenation of mtd's. Is there a better solution?
        if: "@data-empty-in-2D and not(ancestor::*[self::m:piecewise or self::m:system-of-equations or self::m:lines])"
        then: [t: "prázdne"]                       # want to say something for fraction (etc) with empty child
        else: [t: ""]

 - "¬": [t: "negácia"]                             # 0xac
 - "°": [t: "stupňov"]                           # 0xb0
 - "±": [t: "plus mínus"]                          # 0xb1
 - "´": [t: "dĺžeň"]                            # 0xb4
 - "·":                                            # 0xB7
    - test:
        - if: "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and preceding-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')] and following-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')]"
          then: [t: ""]
        - else_if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')] or not($SpeechStyle = 'ClearSpeak' and $ClearSpeak_MultSymbolDot = 'Auto')"
          then: [t: "bodka"]
          else: [t: "krát"]
 - "×":                                          # 0xd7
    - test:
        if: "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and preceding-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')] and following-sibling::*[1][self::m:unit or contains(@data-intent-property, ':unit:')]"
        then: [t: ""]
        else_test:
            if: "$SpeechStyle = 'ClearSpeak'"
            then_test:
            - if: "$ClearSpeak_MultSymbolX = 'Auto'"
              then: [t: "krát"]
            - else_if: "$ClearSpeak_MultSymbolX = 'By'"
              then: [t: "krát"]
              else: [t: "krížik"]
            else_test:
                if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
                then: [t: "krížik"]
                else: [t: "krát"]

 - "÷": [t: "deleno"]                              # 0xf7
 - "̀": [t: "prízvuk"]                             # 0x300
 - "́": [t: "dĺžeň"]                               # 0x301
 - "̂": [t: "vokáň"]                               # 0x302
 - "̃": [t: "vlnovka"]                             # 0x303
 - "̄": [t: "makron"]                              # 0x304
 - "̅": [t: "pruh nad"]                            # 0x305
 - "̆": [t: "oblúčik"]                             # 0x306
 - "̇": [t: "bodka nad"]                           # 0x307

   # Note: ClearSpeak has pref TriangleSymbol for "Δ", but that is wrong
 - "Α-Ω":
    - test:
        if: "$CapitalLetters_Beep"
        then:
        - audio:
            value: "beep.mp4"
            replace: []
    - test:
        if: "$CapitalLetters_UseWord"
        then_test:
          if: "$SpeechOverrides_CapitalLetters = ''"
          then_test:
            if: "$Impairment = 'Blindness'"
            then: [t: "veľké"]
          else: [x: "$SpeechOverrides_CapitalLetters"]
    - pitch:
        value: "$CapitalLetters_Pitch"
        # note: processing of ranges converts '.' into the character, so it needs to be in quotes below
        replace: [spell: "translate('.', 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡ΢ΣΤΥΦΧΨΩ', 'αβγδεζηθικλμνξοπρςστυφχψω')"]

 # Greek letter names: SABP 2021 (Slovak Braille rules), lowercase table
 - "α": [t: "alfa"]                                # 0x3b1
 - "β": [t: "beta"]                                # 0x3b2
 - "γ": [t: "gama"]                                # 0x3b3
 - "δ": [t: "delta"]                               # 0x3b4
 - "ε": [t: "epsilon"]                             # 0x3b5
 - "ζ": [t: "zéta"]                                # 0x3b6
 - "η": [t: "éta"]                                 # 0x3b7
 - "θ": [t: "théta"]                               # 0x3b8
 - "ι": [t: "iota"]                                # 0x3b9
 - "κ": [t: "kapa"]                                # 0x3ba
 - "λ": [t: "lambda"]                              # 0x3bb
 - "μ": [t: "mí"]                                  # 0x3bc
 - "ν": [t: "ní"]                                  # 0x3bd
 - "ξ": [t: "ksí"]                                 # 0x3be
 - "ο": [t: "omikron"]                             # 0x3bf
 - "π": [t: "pí"]                                  # 0x3c0
 - "ρ": [t: "ró"]                                  # 0x3c1
 - "ς": [t: "koncová sigma"]                       # 0x3c2
 - "σ": [t: "sigma"]                               # 0x3c3
 - "τ": [t: "tau"]                                 # 0x3c4
 - "υ": [t: "upsilon"]                             # 0x3c5
 - "φ": [t: "fí"]                                  # 0x3c6
 - "χ": [t: "chí"]                                 # 0x3c7
 - "ψ": [t: "psí"]                                 # 0x3c8
 - "ω": [t: "omega"]                               # 0x3c9
 - "ϕ": [t: "fí"]                                  # 0x3d5
 - "ϖ": [t: "pí"]                                  # 0x3d6
 - "ϵ": [t: "epsilon"]                             # 0x3f5
 - "϶": [t: "obrátený epsilon"]                    # 0x3f6

 - "⁡":                                          # 0x2061
    - test:
        # skip saying "of" when Terse and a trig function, when it is a shape (does this happen?), or we are in :literal mode
        if: "not(
              ( $Verbosity='Terse' or ($SpeechStyle = 'ClearSpeak' and IsNode(following-sibling::*[1],'simple')) and
                preceding-sibling::*[1][IfThenElse($SpeechStyle='ClearSpeak',
                                                   IsInDefinition(., 'ClearSpeakTrigFunctionNames'),
                                                   IsInDefinition(., 'TrigFunctionNames') )]
              ) or
              preceding-sibling::*[1][IsInDefinition(., 'GeometryShapes')] or
              (@data-changed='added' and ancestor-or-self::*[contains(@data-intent-property, ':literal:')])
            )"
        then: [t: "od"]
 - "⁢": [t: ""]                                   # 0x2062
 - "⁣": [t: ""]                                   # 0x2063
 - "⁤": [t: "a"]                                  # 0x2064
 - "ℂℕℚℝℤ":     # here we rely on this running through the table again to speak "cap xxx"
    - t: "dvojité"
    - spell: "translate('.', 'ℂℕℚℝℤ', 'CNQRZ')"

 - "℃": [t: "stupňov Celzia"]                      # 0x2103
 - "ℋℛℓ":                                          # 0x210b
    - t: "písané"
    - spell: "translate('.', 'ℋℛℓ', 'HRl')"
 - "ℜ":                                          # 0x211c
    - t: "fraktúrové"
    - spell: "'R'"

 - "ⅆⅇⅈⅉ":                                          # 0x2146-9
    - t: "dvojité kurzívne"
    - spell: "translate('.', 'ⅆⅇⅈⅉ', 'deij')"

 - "←": [t: "šípka vľavo"]                    # 0x2190
 - "↑": [t: "šípka hore"]                     # 0x2191
 - "→":                                          # 0x2192
     - test:
        if: "ancestor::*[2][self::m:limit]"
        then: [t: "idúce k"]
        else: [t: "šípka vpravo"]

 - "↓": [t: "šípka dole"]                     # 0x2193
 - "∈":                                          # 0x2208
     - test:
        if: "$SpeechStyle != 'ClearSpeak'"
        then:
        - test:
            if: "$Verbosity!='Terse' and not(ancestor::*[self::m:set])"    # "the set x is an element of ..." sounds bad"
            then: [t: "je"]
        - t: "prvkom"
        # Several options for speaking elements in ClearSpeak -- they split between being inside a set or not and then the option
        else_test:
            if: "../../self::m:set or ../../../self::m:set" # inside a set
            then_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "z"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "prvok"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "prvok"]
              - else: [t: "patriace do"]             # $ClearSpeak_SetMemberSymbol = 'Belongs'
            else_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "je z"]
              - else: [t: "patrí do"]              # $ClearSpeak_SetMemberSymbol = 'Belongs'
 - "∥":                                           # 0x2225
     - test:
         if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
         then: [t: "dvojitá zvislá čiara"]
         else:
         - test:
              if: "$Verbosity!='Terse'"
              then: [t: "je"]
         - t: "rovnobežná s"
 - "∦":                                           # 0x2226
     # Slovak puts the negation on the verb, so there is no separate "is" here
     - t: "nie je rovnobežná s"
 - "≤":                                          # 0x2264
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "menší alebo rovný"
 - "≥":                                          # 0x2265
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "väčší alebo rovný"

 # --- restored complex short definitions (prefer over unicode-full) ---
 - "…":                                          # 0x2026
    test:
        if:
            - "$SpeechStyle != 'ClearSpeak' or $ClearSpeak_Ellipses = 'Auto' or"
               # must be ClearSpeak and $ClearSpeak_Ellipses = 'AndSoOn'
               # speak '…' as 'and so on...' unless expr starts with '…'
            - "../*[1][.='…']"
        then: [t: "bodka bodka bodka"]
        else_test:  # must have $ClearSpeak_Ellipses = 'AndSoOn'
            if: "count(following-sibling::*) = 0"
            then: [t: "a tak ďalej"]
            else: [t: "a tak ďalej až po"]
 - "∂":                                          # 0x2202
     - test:
         if: "$Verbosity='Terse'"
         then: [t: "parciálne"]
         else: [t: "parciálna derivácia"]
 - "∆":                                          # 0x2206
     - t: "laplacián z"
 - "∉":                                          # 0x2209
    # rule is identical to 0x2208
     - test:
        if: "$SpeechStyle != 'ClearSpeak'"
        then:
        - test:
            if: "$Verbosity!='Terse'"
            then: [t: "nie je"]
            else: [t: "nie"]
        - t: "prvkom"
        # Several options for speaking elements in ClearSpeak -- they split between being inside a set or not and then the option
        else_test:
            if: "../../self::m:set or ../../../self::m:set" # inside a set
            then_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "nie z"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "nie prvok"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "nie prvok"]
              - else: [t: "nepatriace do"]             # $ClearSpeak_SetMemberSymbol = 'Belongs'
            else_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "nie je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "nie je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "nie je z"]
              - else: [t: "nepatrí do"]              # $ClearSpeak_SetMemberSymbol = 'Belongs'
 - "∊":                                          # 0x220a
     - test:
        if: "$SpeechStyle != 'ClearSpeak'"
        then:
        - test:
            if: "$Verbosity!='Terse' and not(ancestor::*[self::m:set])"    # "the set x is an element of ..." sounds bad"
            then: [t: "je"]
        - t: "prvkom"
        # Several options for speaking elements in ClearSpeak -- they split between being inside a set or not and then the option
        else_test:
            if: "../../self::m:set or ../../../self::m:set" # inside a set
            then_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "z"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "prvok"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "prvok"]
              - else: [t: "patriace do"]             # $ClearSpeak_SetMemberSymbol = 'Belongs'
            else_test:
              - if: $ClearSpeak_SetMemberSymbol = 'Auto' or $ClearSpeak_SetMemberSymbol = 'Member'
                then: [t: "je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'Element'
                then: [t: "je prvkom"]
              - else_if: $ClearSpeak_SetMemberSymbol = 'In'
                then: [t: "je z"]
              - else: [t: "patrí do"]              # $ClearSpeak_SetMemberSymbol = 'Belongs'
 - "√":                                          # 0x221a
     - t: "druhá odmocnina z"
 - "∝":                                          # 0x221d
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "úmerné"
 - "∶":                                          # 0x2236
     # ratio, "a ku b"; Slovak has no "is" here
     - t: "ku"
 - "∾":                                          # 0x223e
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "najkladnejšie"
 - "≠":                                          # 0x2260
     # Slovak puts the negation on the verb, so there is no separate "is" here
     - t: "sa nerovná"
 - "≡":                                          # 0x2261
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "totožné s"
 - "⊂":                                          # 0x2282
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "podmnožinou"
 - "⊃":                                          # 0x2283
     - test:
         if: "$Verbosity!='Terse'"
         then: [t: "je"]
     - t: "nadmnožinou"
